name: Nightly Biotech Trial & SEC Scanner

on:
  schedule:
    # Runs automatically every night at 02:00 UTC (10:00 PM EDT)
    - cron: '0 2 * * *'
  workflow_dispatch: # Lets you click "Run workflow" manually anytime!

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run SEC + ClinicalTrials.gov Diff Engine
        run: python biotech_engine.py

      - name: Commit & Push updated website + state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add previous_state.json index.html
          git diff --staged --quiet || git commit -m "Auto-update daily biotech trial diffs & SEC cash"
          git push
          
