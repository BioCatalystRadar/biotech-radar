name: Nightly Biotech Trial & SEC Scanner

on:
  schedule:
    - cron: '15 2,10,18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'radar.py'
      - 'site_builder.py'
      - 'config.json'
      - '.github/workflows/daily_scan.yml'

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "requests>=2.32,<3" "urllib3>=2.0,<3"

      - name: Run Radar Engine
        env:
          SEC_USER_AGENT: "BioCatalystRadar contact@biocatalystradar.com"
        run: python radar.py

      - name: Copy generated site to root & commit state
        run: |
          cp site/index.html site/feed.xml site/robots.txt site/.nojekyll .
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ index.html feed.xml robots.txt .nojekyll
          git diff --staged --quiet || git commit -m "Auto-update BioCatalyst Radar snapshot"
          git push
